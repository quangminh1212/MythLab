<h1>MythLab Reader</h1>
<p>Máy chủ đang chạy, nhưng bản dựng này chưa kèm giao diện web.</p>
<p>Dựng giao diện trong thư mục <code>web/</code> rồi chép <code>web/dist/</code> vào
<code>server/internal/webui/dist/</code> trước khi build máy chủ, hoặc chạy máy chủ với
<code>--static &lt;thư mục giao diện&gt;</code>.</p>
<p>API vẫn hoạt động: <a href="/api/ping">/api/ping</a>.</p>
