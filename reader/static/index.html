<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MythLab Truyện</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/reader-settings.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="btnMenu" title="Nguồn truyện" aria-label="Nguồn truyện">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#/"><span class="logo"><svg viewBox="0 0 24 24"><path d="M4 5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H4zM20 5h-4a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5H20z"/></svg></span><span>Myth<b>Lab</b></span><small>Truyện</small></a>
  <div class="crumb" id="crumb"></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnSettings" title="Cài đặt đọc / nghe" aria-label="Cài đặt">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="about">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg></div>
      <h3>Về MythLab</h3>
      <p>Đọc và nghe truyện bằng giọng đọc tự nhiên.</p>
    </div>
    <div class="side-head">Nguồn truyện</div>
    <nav id="sources"><div class="muted pad">Đang tải…</div></nav>
    <div class="side-foot muted">Định dạng: <code>&lt;Truyện&gt;/Chương N ….txt</code> + <code>info.json</code></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main id="view" class="view"></main>
</div>

<!-- Player -->
<div class="player hidden" id="player">
  <div class="player-progress"><div id="pProg"></div></div>
  <div class="player-row">
    <div class="p-meta">
      <div class="p-title" id="pTitle">—</div>
      <div class="p-sub" id="pSub">—</div>
    </div>
    <div class="p-ctrls">
      <button class="icon-btn" id="pPrevCh" title="Chương trước (Shift+←)"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg></button>
      <button class="icon-btn" id="pBack" title="Đoạn trước"><svg viewBox="0 0 24 24"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg></button>
      <button class="play-btn" id="pPlay" title="Phát / Dừng (Space)" aria-label="Phát"><svg viewBox="0 0 24 24" id="pPlayIcon"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button class="icon-btn" id="pFwd" title="Đoạn sau"><svg viewBox="0 0 24 24"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"/></svg></button>
      <button class="icon-btn" id="pNextCh" title="Chương sau (Shift+→)"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></svg></button>
    </div>
    <div class="p-opts">
      <select id="pRate" title="Tốc độ đọc"></select>
      <select id="pSleep" title="Hẹn giờ tắt">
        <option value="0">⏾ Tắt hẹn giờ</option>
        <option value="15">⏾ 15 phút</option><option value="30">⏾ 30 phút</option>
        <option value="45">⏾ 45 phút</option><option value="60">⏾ 60 phút</option>
        <option value="90">⏾ 90 phút</option><option value="-1">⏾ Hết chương</option>
      </select>
      <button class="icon-btn" id="pClose" title="Đóng trình phát"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</div>

<!-- Settings drawer -->
<div class="drawer hidden" id="settings" role="dialog" aria-label="Cài đặt">
  <div class="drawer-head"><b>Cài đặt</b><button class="icon-btn" id="sClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="drawer-body"></div>
</div>

<!-- Page mode: tap zones (trang trước / ẩn-hiện thanh công cụ / trang sau) + brightness overlay -->
<div class="tapzones" id="tapzones"><button type="button" data-z="prev" aria-label="Trang trước"></button><button type="button" data-z="menu" aria-label="Ẩn/hiện thanh công cụ"></button><button type="button" data-z="next" aria-label="Trang sau"></button></div>
<div id="dim" aria-hidden="true"></div>

<div class="toast hidden" id="toast"></div>
<script src="js/store.js"></script>
<script src="js/textutil.js"></script>
<script src="js/fonts.js"></script>
<script src="js/settings.js"></script>
<script src="js/backend-server.js"></script>
<script src="js/backend-github.js"></script>
<script src="js/backends.js"></script>
<script src="js/tts.js"></script>
<script src="js/settings-panel.js"></script>
<script src="js/pwa.js"></script>
<script src="app.js"></script>
</body>
</html>
