<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MythLab Truyện</title>
<meta name="theme-color" content="#f6f1e7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a3542a'/%3E%3Cpath d='M18 16h12a6 6 0 0 1 6 6v28a5 5 0 0 0-5-5H18zM46 16H38a6 6 0 0 0-2 .3V50a5 5 0 0 1 5-5h5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="btnMenu" title="Nguồn truyện" aria-label="Nguồn truyện">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#/">MythLab <span>Truyện</span></a>
  <div class="crumb" id="crumb"></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnSettings" title="Cài đặt đọc / nghe" aria-label="Cài đặt">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">Nguồn truyện</div>
    <nav id="sources"><div class="muted pad">Đang tải…</div></nav>
    <div class="side-foot muted">Định dạng: <code>&lt;Truyện&gt;/Chương N ….txt</code> + <code>info.json</code></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main id="view" class="view"></main>
</div>

<!-- Player -->
<div class="player hidden" id="player">
  <div class="player-progress"><div id="pProg"></div></div>
  <div class="player-row">
    <div class="p-meta">
      <div class="p-title" id="pTitle">—</div>
      <div class="p-sub" id="pSub">—</div>
    </div>
    <div class="p-ctrls">
      <button class="icon-btn" id="pPrevCh" title="Chương trước (Shift+←)"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg></button>
      <button class="icon-btn" id="pBack" title="Đoạn trước"><svg viewBox="0 0 24 24"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg></button>
      <button class="play-btn" id="pPlay" title="Phát / Dừng (Space)" aria-label="Phát"><svg viewBox="0 0 24 24" id="pPlayIcon"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button class="icon-btn" id="pFwd" title="Đoạn sau"><svg viewBox="0 0 24 24"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"/></svg></button>
      <button class="icon-btn" id="pNextCh" title="Chương sau (Shift+→)"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></svg></button>
    </div>
    <div class="p-opts">
      <select id="pRate" title="Tốc độ đọc"></select>
      <select id="pSleep" title="Hẹn giờ tắt">
        <option value="0">⏾ Tắt hẹn giờ</option>
        <option value="15">⏾ 15 phút</option><option value="30">⏾ 30 phút</option>
        <option value="45">⏾ 45 phút</option><option value="60">⏾ 60 phút</option>
        <option value="90">⏾ 90 phút</option><option value="-1">⏾ Hết chương</option>
      </select>
      <button class="icon-btn" id="pClose" title="Đóng trình phát"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</div>

<!-- Settings drawer -->
<div class="drawer hidden" id="settings" role="dialog" aria-label="Cài đặt">
  <div class="drawer-head"><b>Cài đặt</b><button class="icon-btn" id="sClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="drawer-body">
    <h4>Hiển thị</h4>
    <label>Giao diện
      <div class="seg" id="sTheme">
        <button data-v="light">Sáng</button><button data-v="sepia">Giấy</button><button data-v="dark">Tối</button><button data-v="auto">Tự động</button>
      </div>
    </label>
    <label>Phông chữ
      <div class="seg" id="sFont">
        <button data-v="serif">Có chân</button><button data-v="sans">Không chân</button>
      </div>
    </label>
    <label>Cỡ chữ <span id="sSizeV"></span><input type="range" id="sSize" min="14" max="30" step="1"></label>
    <label>Giãn dòng <span id="sLineV"></span><input type="range" id="sLine" min="1.4" max="2.4" step="0.1"></label>
    <label>Độ rộng cột <span id="sWidthV"></span><input type="range" id="sWidth" min="520" max="1000" step="20"></label>
    <h4>Giọng đọc</h4>
    <label>Bộ đọc
      <div class="seg" id="sEngine">
        <button data-v="edge">Edge (tự nhiên)</button><button data-v="browser">Trình duyệt</button>
      </div>
    </label>
    <label>Giọng <select id="sVoice"></select></label>
    <label class="row"><input type="checkbox" id="sAutoNext"> Tự chuyển chương khi nghe hết</label>
    <label class="row"><input type="checkbox" id="sFollow"> Tự cuộn theo đoạn đang đọc</label>
    <label class="row"><input type="checkbox" id="sReadTitle"> Đọc tiêu đề chương</label>
    <p class="muted small">Mẹo: nhấp đúp vào một đoạn để nghe từ đó. Phím tắt: <kbd>Space</kbd> phát/dừng, <kbd>←</kbd>/<kbd>→</kbd> chương trước/sau, <kbd>J</kbd>/<kbd>K</kbd> đoạn sau/trước.</p>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
